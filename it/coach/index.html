<!doctype html> <html lang="it"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <meta name="description" content="Crea piani alimentari e salvali nella cartella del tuo PC."> <link rel="canonical" href="https://rscexperience.github.io/pastilo/it/coach/"> <link rel="stylesheet" href="../../assets/coach.css"> <script defer="defer" src="../../assets/coach.js"></script> <title>Pastilo · Area coach</title> </head> <body> <header class="masthead"> <div class="wrap masthead-inner"> <a class="wordmark" href="../../app-it.html"><img src="../../assets/logo.svg" width="36" height="36" alt="">Pastilo</a> <nav><a href="../../app-it.html">Scopri Pastilo</a><a id="change-language" href="../../en/coach/" lang="en">English</a></nav> </div> </header> <main class="wrap"> <header class="hero"><h1>Area coach</h1><p>Crea piani alimentari e salvali nella cartella del tuo PC.</p></header> <p id="status" role="status" aria-live="polite" hidden></p> <section id="start" class="surface start"> <span class="tile-icon" aria-hidden="true">⌑</span> <h2 data-copy="folderTitle"></h2> <p data-copy="folderIntro"></p> <button id="choose" class="primary" data-copy="choose"></button> <small data-copy="local"></small> </section> <div id="workspace" class="workspace" hidden> <aside class="surface sidebar" aria-labelledby="people-title"> <div class="folder-info"><span data-copy="folderTitle"></span><strong id="folder"></strong><button id="change-folder" class="quiet" data-copy="change"></button></div> <button id="profile" class="profile-button"><img id="profile-image" width="44" height="44" alt="" hidden><span id="profile-name"></span><span aria-hidden="true">›</span></button> <div class="sidebar-heading"><h2 id="people-title" data-copy="people"></h2><button id="new" class="quiet" data-copy="new"></button></div> <ul id="people" class="people"></ul> </aside> <section class="surface editor"> <div id="empty" class="empty"><h2 data-copy="planTitle"></h2><p data
